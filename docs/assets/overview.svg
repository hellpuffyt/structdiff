<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">structdiff pipeline</title>
  <desc id="d">Two JSON or YAML documents are parsed by parseDocument in src/core/parse.ts, walked together in src/core/diff.ts, where keys present on one side only become candidates keyed by an exact canonical form from src/core/hash.ts. reconcileMoves pairs candidates that are unique on both sides into moved, renamed or moved-renamed ops, arrays get an LCS, exact-content and positional pass, and the resulting DiffResult is printed by the CLI or rendered by the web viewer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A3AAA6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3FBF8A"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#0C0D0D"/>

  <text x="40" y="44" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#EEEAE2">structdiff: diff the trees, then pair removals with additions</text>
  <text x="40" y="68" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#A3AAA6">Data flow through src/core for one comparison. Everything runs in-process; the CLI and the web viewer share the same core.</text>

  <!-- inputs -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="40" y="108" width="150" height="54" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="115" y="132" text-anchor="middle" font-size="13" fill="#EEEAE2">old-file</text>
    <text x="115" y="150" text-anchor="middle" font-size="11" fill="#A3AAA6">.json / .yaml</text>
    <rect x="40" y="182" width="150" height="54" rx="6" fill="#17191A" stroke="#2A2E2D"/>
    <text x="115" y="206" text-anchor="middle" font-size="13" fill="#EEEAE2">new-file</text>
    <text x="115" y="224" text-anchor="middle" font-size="11" fill="#A3AAA6">.json / .yaml</text>
  </g>

  <!-- parse -->
  <rect x="230" y="120" width="170" height="104" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="246" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#EEEAE2">parse.ts</text>
  <text x="246" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6">parseDocument()</text>
  <text x="246" y="190" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">JSON.parse or yaml,</text>
  <text x="246" y="207" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">one document per file</text>

  <path d="M190 135 L228 160" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M190 209 L228 186" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- walk -->
  <rect x="440" y="100" width="220" height="144" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="456" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#EEEAE2">diff.ts  walk</text>
  <text x="456" y="150" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">Key on both sides: recurse,</text>
  <text x="456" y="167" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">emit changed / unchanged.</text>
  <text x="456" y="191" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">Key on one side only: register</text>
  <text x="456" y="208" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">a candidate for it and every</text>
  <text x="456" y="225" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">node in its subtree.</text>

  <path d="M400 172 L438 172" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- hash -->
  <rect x="440" y="290" width="220" height="86" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="456" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#EEEAE2">hash.ts</text>
  <text x="456" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6">createCanonicalizer()</text>
  <text x="456" y="360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">sorted-key canonical string</text>

  <path d="M550 244 L550 288" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="540" y="272" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#A3AAA6">exact content key</text>

  <!-- reconcile -->
  <rect x="700" y="100" width="230" height="144" rx="6" fill="#17191A" stroke="#3FBF8A"/>
  <text x="716" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3FBF8A">reconcileMoves()</text>
  <text x="716" y="150" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">Pair a removed and an added</text>
  <text x="716" y="167" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">candidate when the key is unique</text>
  <text x="716" y="184" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">on both sides and passes</text>
  <text x="716" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6">--min-match</text>
  <text x="716" y="225" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">Biggest subtree wins first.</text>

  <path d="M660 172 L698 172" stroke="#3FBF8A" stroke-width="1.5" fill="none" marker-end="url(#g)"/>

  <!-- arrays -->
  <rect x="700" y="290" width="230" height="86" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="716" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#EEEAE2">array pass</text>
  <text x="716" y="338" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">LCS, then exact content,</text>
  <text x="716" y="356" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6">then position by position</text>

  <path d="M600 244 C 620 270, 680 300, 698 320" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- classify / result -->
  <rect x="970" y="100" width="190" height="144" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="986" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#EEEAE2">DiffResult</text>
  <text x="986" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6">ops[] + stats</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6">
    <text x="986" y="172">added  removed  changed</text>
    <text x="986" y="190">unchanged</text>
    <text x="986" y="208" fill="#3FBF8A">moved  renamed</text>
    <text x="986" y="226" fill="#3FBF8A">moved-renamed</text>
  </g>

  <path d="M930 172 L968 172" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M930 333 C 950 333, 960 260, 1000 246" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- consumers -->
  <rect x="970" y="290" width="190" height="62" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="986" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2">cli/index.ts</text>
  <text x="986" y="334" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#A3AAA6">text or --json, exit 0/1/2</text>

  <rect x="970" y="368" width="190" height="62" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="986" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2">web/App.tsx</text>
  <text x="986" y="412" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#A3AAA6">side-by-side, in the browser</text>

  <path d="M1160 244 C 1185 270, 1185 300, 1162 318" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M1160 244 C 1195 290, 1195 370, 1162 398" stroke="#A3AAA6" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- classification legend -->
  <rect x="40" y="290" width="360" height="140" rx="6" fill="#17191A" stroke="#2A2E2D"/>
  <text x="56" y="316" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#EEEAE2">How a paired removal + addition is named</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">
    <text x="56" y="344" fill="#A3AAA6">same parent, new key</text>
    <text x="260" y="344" fill="#3FBF8A">renamed</text>
    <text x="56" y="368" fill="#A3AAA6">new parent, same key</text>
    <text x="260" y="368" fill="#3FBF8A">moved</text>
    <text x="56" y="392" fill="#A3AAA6">both different</text>
    <text x="260" y="392" fill="#3FBF8A">moved-renamed</text>
    <text x="56" y="416" fill="#A3AAA6">no unique pair</text>
    <text x="260" y="416" fill="#EEEAE2">removed + added</text>
  </g>
</svg>
